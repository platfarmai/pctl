<!doctype html>
<html lang="zh-CN" data-pf-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platfarm Console</title>
<link rel="stylesheet" href="/platform/ui/v1/pf-ui.css">
<script src="/platform/ui/v1/pf-ui.js" defer></script>
<style>
  html, body.pf-body { height: 100%; }
  body.pf-body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  #wrap { flex: 1; display: flex; min-height: 0; }
  #panel {
    flex: 1;
    overflow: auto;
    padding: 20px;
  }
  iframe {
    flex: 1;
    border: 0;
    background: var(--pf-surface);
  }
  #login {
    margin: 80px auto;
    width: fit-content;
    max-width: 360px;
  }
  #login .pf-card { min-width: 280px; }
  pre.pf-log {
    background: var(--pf-surface);
    border: 1px solid var(--pf-border);
    border-radius: var(--pf-radius);
    padding: 12px;
    max-height: 320px;
    overflow: auto;
    white-space: pre-wrap;
    font-family: var(--pf-font-mono);
    font-size: var(--pf-fs-12);
    color: var(--pf-text);
    margin: 0;
  }
  #msg {
    color: var(--pf-danger);
    min-height: 20px;
    font-size: var(--pf-fs-13);
  }
  .pf-section > h2 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  pf-topbar .pf-topbar-actions { gap: 12px; }
  #nav { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body class="pf-body">
<pf-topbar title="Platfarm 控制台">
  <nav id="nav" hidden></nav>
  <span id="who" class="pf-muted"></span>
  <pf-button id="logout" variant="ghost" size="sm" hidden onclick="logout()">退出</pf-button>
</pf-topbar>

<div id="login">
  <div class="pf-card">
    <form class="pf-form" onsubmit="event.preventDefault(); login();">
      <button type="submit" hidden tabindex="-1" aria-hidden="true"></button>
      <div class="pf-field">
        <label for="u">用户名</label>
        <input id="u" placeholder="用户名" value="admin" autocomplete="username">
      </div>
      <div class="pf-field">
        <label for="p">密码</label>
        <input id="p" placeholder="密码" type="password" autocomplete="current-password">
      </div>
      <pf-button variant="primary" onclick="login()">登录（需 admin 角色）</pf-button>
      <div id="msg"></div>
    </form>
  </div>
</div>

<div id="wrap" hidden>
  <div id="panel">
    <section class="pf-section">
      <h2>服务 <pf-button size="sm" onclick="loadServices()">刷新</pf-button></h2>
      <table class="pf-table"><thead><tr>
        <th>ID</th><th>挂载</th><th>信任</th><th>语言</th><th>状态</th><th>操作</th>
      </tr></thead><tbody id="rows"></tbody></table>
    </section>
    <section class="pf-section"><h2>日志 <span id="logtitle" class="pf-muted"></span></h2><pre id="logs" class="pf-log">（点击服务行的"日志"查看）</pre></section>
    <section class="pf-section"><h2>审计</h2><pre id="audit" class="pf-log">-</pre></section>
    <p class="pf-muted">SSO：登录后打开各应用后台无需再次登录。创建/卸载类操作仍走宿主机 pctl CLI。</p>
  </div>
  <iframe id="frame" hidden></iframe>
</div>

<script>
const $ = id => document.getElementById(id);
// Cookie 会话（specs/006）：无需在 JS 持有 token；同源请求自动带 pf_access，Kong 补 Bearer。
const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: 'same-origin', ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { showLogin(); throw new Error('未登录'); }
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
};

async function login() {
  $('msg').textContent = '';
  try {
    const r = await fetch('login', { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ Username: $('u').value, Password: $('p').value }) });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || '登录失败');
    // 登录响应已通过 Set-Cookie 写入 pf_access；无需存 localStorage
    enter();
  } catch (e) { $('msg').textContent = e.message; }
}

function showLogin() {
  $('login').hidden = false; $('wrap').hidden = true; $('nav').hidden = true; $('logout').hidden = true;
}

async function enter() {
  $('login').hidden = true; $('wrap').hidden = false; $('logout').hidden = false;
  try {
    const me = await fetch('../../auth/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null);
    $('who').textContent = me ? (me.username + ' (' + me.role + ')') : '已登录';
  } catch { $('who').textContent = '已登录'; }
  await buildNav();
  loadServices();
}

async function buildNav() {
  let apps = [];
  try { apps = await api('api/apps'); } catch {}
  const nav = $('nav'); nav.hidden = false;
  const tabs = [`<pf-button size="sm" variant="primary" onclick="showConsole(this)">控制台</pf-button>`];
  for (const a of apps) {
    if (!a.Embed) {
      tabs.push(`<pf-button size="sm" variant="ghost" onclick="window.open('${a.URL}','_blank')">${a.Title} ↗</pf-button>`);
    } else {
      tabs.push(`<pf-button size="sm" variant="ghost" onclick="showApp(this,'${a.URL}')">${a.Title}</pf-button>`);
    }
  }
  nav.innerHTML = tabs.join('');
}

function setActive(btn) {
  const host = btn.closest('pf-button') || btn;
  for (const b of $('nav').children) {
    b.setAttribute('variant', 'ghost');
  }
  host.setAttribute('variant', 'primary');
}
function showConsole(btn) { setActive(btn); $('panel').hidden = false; $('frame').hidden = true; $('frame').src = 'about:blank'; }
function showApp(btn, url) { setActive(btn); $('panel').hidden = true; $('frame').hidden = false; $('frame').src = url; }

function logout() {
  fetch('../../auth/logout', { method: 'POST', credentials: 'same-origin' }).finally(() => location.reload());
}

async function loadServices() {
  try {
    const rows = await api('api/services');
    $('rows').innerHTML = rows.map(s => {
      const stateLabel = s.Enabled ? s.State : 'disabled';
      const tone = (s.State === 'exited' || s.State === 'absent') ? 'danger'
        : (s.State === 'running' ? 'ok' : 'neutral');
      return `<tr>
      <td>${s.ID}</td><td>${s.Mount}</td><td>${s.Trust}</td><td>${s.Lang}</td>
      <td><span class="pf-dot" data-tone="${tone}">${stateLabel}</span> <span class="pf-muted">${s.Status}</span></td>
      <td>
        <pf-button size="sm" variant="ghost" onclick="toggle('${s.ID}', ${!s.Enabled})">${s.Enabled ? '停用' : '启用'}</pf-button>
        <pf-button size="sm" variant="ghost" onclick="logs('${s.ID}')">日志</pf-button>
      </td></tr>`;
    }).join('');
    const audit = await api('api/audit');
    $('audit').textContent = (audit || []).filter(Boolean).join('\n') || '（暂无操作记录）';
  } catch (e) { if (e.message !== '未登录') alert(e.message); }
}

async function toggle(id, enable) {
  if (!confirm(`确认${enable ? '启用' : '停用'} ${id}？（将重新生成网关配置并重启网关）`)) return;
  try { await api(`api/services/${id}/toggle`, { method: 'POST', body: JSON.stringify({ Enable: enable }) }); }
  catch (e) { alert(e.message); }
  loadServices();
}

async function logs(id) {
  $('logtitle').textContent = id;
  try { $('logs').textContent = (await api(`api/services/${id}/logs`)).logs || '（空）'; }
  catch (e) { $('logs').textContent = e.message; }
}

// 启动：cookie 会话存在则直接进入；否则显示登录
fetch('../../auth/me', { credentials: 'same-origin' }).then(r => { if (r.ok) enter(); else showLogin(); }).catch(showLogin);
</script>
</body>
</html>

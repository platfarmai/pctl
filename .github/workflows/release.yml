name: Release pctl

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-dev}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="dev-${GITHUB_SHA::7}"
          fi
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            ext=""
            [[ "$os" == windows ]] && ext=".exe"
            out="pctl_${ver}_${os}_${arch}${ext}"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/$out" .
          done
          cd dist
          sha256sum pctl_* > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: pctl-binaries
          path: dist/*
